<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Holost.v</title>
<style>
  /* Layout: name + instruction on top, particle canvas full screen, small read-only code card floating at the bottom (typed live). Single dark look by choice. */
  :root{
    --bg:#000;
    --ink:#eadfe3;
    --dim:#7d7077;
    --red:#ff5a76;
    --rose:#ffd3dc;
    --pink:#ffb0bf;
    --card:rgba(12,8,13,.74);
    --edge:rgba(255,255,255,.09);
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"Roboto Mono",monospace;
    --gutter:max(16px,env(safe-area-inset-left,0px),env(safe-area-inset-right,0px));
    color-scheme:dark;
  }
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;touch-action:none;
    font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

  .top{position:fixed;top:0;left:0;right:0;text-align:center;pointer-events:none;
    padding:calc(18px + env(safe-area-inset-top,0px)) var(--gutter) 0}
  .brand{font-size:18px;font-weight:600;letter-spacing:.18em;color:var(--rose);
    text-shadow:0 0 16px rgba(255,60,90,.6)}
  .hint{margin-top:6px;font-size:13px;letter-spacing:.06em;color:rgba(255,235,240,.7);
    transition:opacity .6s ease;animation:breathe 3.2s ease-in-out infinite}
  @keyframes breathe{50%{opacity:.45}}
  body.holding .hint{opacity:.22;animation:none}
  @media (prefers-reduced-motion:reduce){.hint{animation:none}}

  .panel{position:fixed;left:0;right:0;margin-inline:auto;
    bottom:calc(10px + env(safe-area-inset-bottom,0px));
    width:min(620px,calc(100% - 2 * var(--gutter)));
    background:var(--card);border:1px solid var(--edge);border-radius:12px;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    font-size:clamp(10px,2.7vw,12px);pointer-events:none;overflow:hidden}
  .bar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--edge)}
  .bar i{width:8px;height:8px;border-radius:50%;background:#ff5f57}
  .bar i:nth-child(2){background:#febc2e}
  .bar i:nth-child(3){background:#28c840}
  .bar span{margin-left:8px;font:11px var(--mono);color:var(--dim);letter-spacing:.03em}
  .bar em{margin-left:auto;font:normal 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;
    color:var(--rose);border:1px solid var(--edge);border-radius:999px;padding:2px 8px}
  .scroll{--lines:12;height:calc(var(--lines) * 1.55em);overflow:hidden;padding:8px 12px 0;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 2.6em);
    mask-image:linear-gradient(to bottom,transparent 0,#000 2.6em)}
  pre{margin:0;font:inherit;font-family:var(--mono);line-height:1.55;white-space:pre;color:var(--ink);tab-size:2}
  .ln{display:inline-block;width:2ch;margin-right:1.4ch;text-align:right;color:#55494f}
  .k{color:var(--red)} .f{color:var(--rose)} .n{color:var(--pink)} .c{color:var(--dim);font-style:italic}
  .cur{display:inline-block;width:.55em;height:1.15em;margin-left:1px;vertical-align:text-bottom;
    background:var(--red);animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.cur{animation:none}}
</style>
<canvas id="c"></canvas>
<div class="top" id="top">
  <div class="brand">Holost.v</div>
  <div class="hint">зажми и води пальцем по экрану</div>
</div>
<div class="panel" id="panel" role="img" aria-label="Код этой анимации">
  <div class="bar"><i></i><i></i><i></i><span>heart.js</span><em>JavaScript</em></div>
  <div class="scroll" id="scroll"><pre id="code"></pre></div>
</div>
<script>
/* ---------- код, который «печатается» в карточке ---------- */
const SOURCE = [
"// сделано: Holost.v",
"const heart = t => ({",
"  x: 16 * Math.sin(t) ** 3,",
"  y: -(13 * Math.cos(t)",
"     - 5 * Math.cos(2 * t)",
"     - 2 * Math.cos(3 * t)",
"     - Math.cos(4 * t))",
"});",
"",
"// внутри сердце залито звёздами",
"const star = () =>",
"  heart(t) * Math.sqrt(random());",
"",
"// галактика: три рукава",
"function galaxy(i) {",
"  const arm = i % 3;",
"  const r = Math.random() ** 0.7;",
"  const a = arm * TAU / 3 + r * 3.2;",
"  return { x: Math.cos(a) * r,",
"           y: Math.sin(a) * r * 0.5 };",
"}",
"",
"// цвет идёт за пальцем",
"hue = x / W * 300 + time * 25;",
"",
"// зажал: взрыв и галактика",
"onHold(() => { burst(); mode = 1 });",
"// отпустил: снова сердце",
"onRelease(() => mode = 0);"
].join("\n");

const segs = [];
(function tokenize(){
  const re = /(\/\/.*)|\b(const|function|return|if)\b|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)(?=\()|([\s\S])/g;
  let m;
  while((m = re.exec(SOURCE))){
    if(m[1]) segs.push({c:'c', t:m[1]});
    else if(m[2]) segs.push({c:'k', t:m[2]});
    else if(m[3]) segs.push({c:'n', t:m[3]});
    else if(m[4]) segs.push({c:'f', t:m[4]});
    else segs.push({c:'', t:m[5]});
  }
})();
const TOTAL = segs.reduce((a, s) => a + s.t.length, 0);
const codeEl = document.getElementById('code');
const scroller = document.getElementById('scroll');
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const lnSpan = n => `<span class="ln">${n}</span>`;

function renderCode(n){
  let html = lnSpan(1), ln = 1, used = 0;
  for(const s of segs){
    if(used >= n) break;
    let t = s.t;
    if(used + t.length > n) t = t.slice(0, n - used);
    used += t.length;
    if(t === '\n'){ ln++; html += '\n' + lnSpan(ln); continue; }
    html += s.c ? `<span class="${s.c}">${esc(t)}</span>` : esc(t);
  }
  codeEl.innerHTML = html + '<span class="cur"></span>';
  scroller.scrollTop = scroller.scrollHeight;
}

let typed = 0, pause = 0;
if(matchMedia('(prefers-reduced-motion: reduce)').matches){
  renderCode(TOTAL);
}else{
  renderCode(0);
  setTimeout(function tick(){
    if(pause > 0){ pause--; return void setTimeout(tick, 40); }
    typed = Math.min(TOTAL, typed + 1 + (Math.random() * 3 | 0));
    renderCode(typed);
    if(SOURCE.charAt(typed - 1) === '\n') pause = 5;
    if(typed < TOTAL) setTimeout(tick, 40);
  }, 700);
}

/* ---------- частицы ---------- */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const panel = document.getElementById('panel');
const topEl = document.getElementById('top');

const TAU = Math.PI * 2;
const CELL = 44;
let W, H, DPR, Y0, AH, scale, cx, cyH, cyG, Rx, Ry, cols, rows, head, next;
let LN = 440, NF = 420, activeN = 440, activeF = 420;

function spriteFrom(stops){
  const s = 48, c = document.createElement('canvas');
  c.width = c.height = s;
  const x = c.getContext('2d');
  const gr = x.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  gr.addColorStop(0, stops[0]); gr.addColorStop(0.25, stops[1]); gr.addColorStop(1, stops[2]);
  x.fillStyle = gr; x.fillRect(0, 0, s, s);
  return c;
}
// звезда с лучиками (для самых ярких точек)
function sparkleFrom(col){
  const s = 64, c = document.createElement('canvas');
  c.width = c.height = s;
  const x = c.getContext('2d');
  const gr = x.createRadialGradient(32, 32, 0, 32, 32, 17);
  gr.addColorStop(0, col(1)); gr.addColorStop(0.3, col(0.6)); gr.addColorStop(1, col(0));
  x.fillStyle = gr; x.fillRect(0, 0, s, s);
  const hg = x.createLinearGradient(0, 0, s, 0);
  hg.addColorStop(0, col(0)); hg.addColorStop(0.5, col(0.95)); hg.addColorStop(1, col(0));
  x.fillStyle = hg; x.fillRect(0, 30.5, s, 3);
  const vg = x.createLinearGradient(0, 0, 0, s);
  vg.addColorStop(0, col(0)); vg.addColorStop(0.5, col(0.95)); vg.addColorStop(1, col(0));
  x.fillStyle = vg; x.fillRect(30.5, 0, 3, s);
  return c;
}
const rgbSprite = c => spriteFrom([`rgba(${c},1)`, `rgba(${c},.55)`, `rgba(${c},0)`]);
const spriteRed = rgbSprite('255,50,80');
const spriteWhite = rgbSprite('255,245,248');
const spritePink = rgbSprite('255,150,175');
const spriteDeep = rgbSprite('255,30,70');
const baseSprites = [spriteRed, spriteWhite, spritePink, spriteDeep];
const baseRGB = ['255,50,80', '255,245,248', '255,150,175', '255,30,70'];
const sparkleBase = baseRGB.map(c => sparkleFrom(a => `rgba(${c},${a})`));

const HUES = 36, HSTEP = 360 / HUES, hueSprites = [], sparkleHue = [];
for(let i = 0; i < HUES; i++){
  const h = i * HSTEP;
  hueSprites.push(spriteFrom([`hsla(${h},100%,66%,1)`, `hsla(${h},100%,62%,.55)`, `hsla(${h},100%,58%,0)`]));
  sparkleHue.push(sparkleFrom(a => `hsla(${h},100%,70%,${a})`));
}
const BUCKETS = 12, BSTEP = 360 / BUCKETS, lineAlpha = [0.2, 0.38, 0.6];
const redStyle = lineAlpha.map(a => `rgba(255,40,70,${a})`);
const whiteStyle = lineAlpha.map(a => `rgba(255,238,242,${a})`);
const hueStyle = [];
for(let b = 0; b < BUCKETS; b++) hueStyle.push(lineAlpha.map(a => `hsla(${b * BSTEP + BSTEP / 2},100%,66%,${a})`));

const heartPoint = t => ({
  x: 16 * Math.pow(Math.sin(t), 3),
  y: -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t))
});

let parts = [], fill = [], stars = [], sparks = [];
const pointer = { x: -999, y: -999 };
let held = false, gcx = 0, gcy = 0, lastPX = 0, lastPY = 0;

function layout(){
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  Y0 = topEl.getBoundingClientRect().bottom + 4;
  AH = Math.max(200, panel.getBoundingClientRect().top - 6 - Y0);
  scale = Math.min(W * 0.8 / 34, AH * 0.8 / 29);
  cx = W / 2;
  cyG = Y0 + AH / 2;
  cyH = cyG - 2.5 * scale;
  Rx = W * 0.42;
  Ry = Math.min(Rx * 0.5, AH * 0.5);
  if(!held){ gcx = cx; gcy = cyG; }
  cols = Math.ceil(W / CELL) + 3;
  rows = Math.ceil(H / CELL) + 3;
  head = new Int32Array(cols * rows);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
}

function pickBase(){
  const r = Math.random();
  return r < 0.38 ? 0 : r < 0.63 ? 1 : r < 0.85 ? 2 : 3;
}

// контурные точки: соединяются линиями
function makeLinked(i){
  const t = Math.random() * TAU;
  const hp = heartPoint(t);
  const k = 1 + (Math.random() - 0.5) * 0.14;
  const rn = 0.05 + Math.pow(Math.random(), 0.75) * 0.95;
  const white = Math.random() < (rn < 0.28 ? 0.8 : 0.3);
  return {
    tx: hp.x * k, ty: hp.y * k,
    gb: (i % 3) * TAU / 3 + rn * 3.4 + (Math.random() - 0.5) * 0.5 * (1.2 - rn),
    rn, gj: (Math.random() - 0.5) * 2,
    d: Math.random(),
    x: Math.random() * W, y: Math.random() * H,
    vx: 0, vy: 0, m: 0, hue: 0,
    ph: Math.random() * TAU,
    sp: 0.6 + Math.random() * 1.2,
    wob: 0.35, tw: 2 + Math.random() * 2,
    r: 0.7 + Math.random() * 1.0, z: 1,
    big: false, white, base: white ? 1 : (Math.random() < 0.5 ? 0 : Math.random() < 0.5 ? 2 : 3)
  };
}

// звёзды внутри сердца: заливка по всей площади
function makeFill(i){
  const t = Math.random() * TAU;
  const hp = heartPoint(t);
  const u = Math.sqrt(Math.random());
  const rn = 0.03 + Math.pow(Math.random(), 0.65) * 1.15;
  const base = pickBase();
  return {
    tx: hp.x * u, ty: hp.y * u,
    gb: (i % 3) * TAU / 3 + rn * 3.4 + (Math.random() - 0.5) * 1.1 * (1.2 - Math.min(rn, 1)),
    rn, gj: (Math.random() - 0.5) * 3,
    d: Math.random(),
    x: Math.random() * W, y: Math.random() * H,
    vx: 0, vy: 0, m: 0, hue: 0,
    ph: Math.random() * TAU,
    sp: 0.5 + Math.random() * 1.6,
    wob: 0.5, tw: 1.2 + Math.random() * 3.2,
    r: 0.5 + Math.random() * 0.9, z: 0.6 + Math.random() * 0.8,
    big: Math.random() < 0.14, white: base === 1, base
  };
}

function init(){
  LN = W < 600 ? 440 : 740;
  NF = W < 600 ? 420 : 700;
  activeN = LN; activeF = NF;
  next = new Int32Array(LN);
  parts = []; fill = []; stars = [];
  for(let i = 0; i < LN; i++) parts.push(makeLinked(i));
  for(let i = 0; i < NF; i++) fill.push(makeFill(i));
  for(let i = 0; i < 90; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, z: 0.3 + Math.random(), ph: Math.random() * TAU });
}

layout();
init();
addEventListener('resize', layout);

/* состояние */
let mode = 0, M = 0, C = 0, boost = 0, flash = 0, flashX = 0, flashY = 0, pop = 0, needPop = false;
let hueBase = 0, time = 0, beat = 1, step = 1, damp = 0.82, stag = 0.35, breath = 1;

function spawnSparks(x, y, n, speedMax, warm){
  for(let i = 0; i < n && sparks.length < 320; i++){
    const a = Math.random() * TAU, sp = 1.5 + Math.random() * speedMax;
    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 1, d: 0.012 + Math.random() * 0.025, hue: hueBase + Math.random() * 90,
      warm: !!warm, b: pickBase(), big: Math.random() < 0.2 });
  }
}

function press(e){
  pointer.x = lastPX = e.clientX; pointer.y = lastPY = e.clientY;
  if(held) return;
  held = true; mode = 1; boost = 0; needPop = false;
  document.body.classList.add('holding');
  gcx = pointer.x; gcy = pointer.y;               // центр галактики рождается под пальцем
  flash = 1; flashX = pointer.x; flashY = pointer.y;
  spawnSparks(pointer.x, pointer.y, 120, 9, false);
  // сердце рассыпается на мелкие звёзды
  const burst = p => {
    const dx = p.x - cx, dy = p.y - cyH, d = Math.hypot(dx, dy) || 1;
    const k = 12 + Math.random() * 36;
    p.vx += dx / d * k - dy / d * 9;
    p.vy += dy / d * k + dx / d * 9;
  };
  parts.forEach(burst); fill.forEach(burst);
}
function release(){
  pointer.x = pointer.y = -999;
  if(!held) return;
  held = false; mode = 0; boost = 1; needPop = true;
  document.body.classList.remove('holding');
}
addEventListener('pointerdown', press);
addEventListener('pointermove', e => { pointer.x = e.clientX; pointer.y = e.clientY; });
addEventListener('pointerup', release);
addEventListener('pointercancel', release);
addEventListener('blur', release);
addEventListener('contextmenu', e => e.preventDefault());

function stepP(p){
  const hx = cx + (p.tx + Math.sin(time * p.sp + p.ph) * p.wob) * scale * beat;
  const hy = cyH + (p.ty + Math.cos(time * p.sp * 0.9 + p.ph) * p.wob) * scale * beat;
  const a = p.gb + time * (0.7 / (0.45 + p.rn)) * 0.5;
  const gx = gcx + Math.cos(a) * p.rn * Rx * breath;
  const gy = gcy + Math.sin(a) * p.rn * Ry * breath + p.gj * Ry * 0.12 * (1 - Math.min(p.rn, 1) * 0.5);
  let s = (M - p.d * stag) / (1 - stag);
  s = s < 0 ? 0 : s > 1 ? 1 : s;
  const m = s * s * (3 - 2 * s);
  p.m = m;
  // цвет меняется и по радиусу, и по углу: получаются цветные рукава
  p.hue = (hueBase + p.rn * 170 + p.d * 60 + a * 28.65) % 360;
  const tx = hx + (gx - hx) * m, ty = hy + (gy - hy) * m;
  const k = (held ? 0.03 + p.d * 0.025 : 0.05 + 0.11 * boost) * step;
  p.vx += (tx - p.x) * k;
  p.vy += (ty - p.y) * k;
  if(!held){
    const dx = p.x - pointer.x, dy = p.y - pointer.y, d2 = dx * dx + dy * dy;
    if(d2 < 16000){
      const d = Math.sqrt(d2) || 1, f = (1 - d / 126) * 3.2 * step;
      p.vx += (dx / d - dy / d * 0.7) * f;
      p.vy += (dy / d + dx / d * 0.7) * f;
    }
  }
  p.vx *= damp; p.vy *= damp;
  p.x += p.vx * step; p.y += p.vy * step;
}

function drawP(p, size, al){
  const half = size / 2;
  if(C < 0.02){
    ctx.globalAlpha = al;
    ctx.drawImage(p.big ? sparkleBase[p.base] : baseSprites[p.base], p.x - half, p.y - half, size, size);
  }else{
    const hi = ((p.hue / HSTEP) | 0) % HUES;
    const hs = p.big ? sparkleHue[hi] : hueSprites[hi];
    if(C > 0.98){
      ctx.globalAlpha = al;
      ctx.drawImage(hs, p.x - half, p.y - half, size, size);
    }else{
      ctx.globalAlpha = al * (1 - C);
      ctx.drawImage(p.big ? sparkleBase[p.base] : baseSprites[p.base], p.x - half, p.y - half, size, size);
      ctx.globalAlpha = al * C;
      ctx.drawImage(hs, p.x - half, p.y - half, size, size);
    }
  }
}

let last = performance.now(), avg = 16, slow = 0, fast = 0;

function frame(now){
  let dt = now - last; last = now;
  if(dt > 100) dt = 100;
  time += dt / 1000;
  avg = avg * 0.92 + dt * 0.08;

  if(avg > 24){ slow++; fast = 0; } else if(avg < 18){ fast++; slow = 0; } else { slow = fast = 0; }
  if(slow > 20 && activeN > 160){
    activeN = Math.max(160, Math.floor(activeN * 0.85));
    activeF = Math.max(120, Math.floor(activeF * 0.85)); slow = 0;
  }
  if(fast > 240 && (activeN < LN || activeF < NF)){
    activeN = Math.min(LN, Math.floor(activeN * 1.1) + 1);
    activeF = Math.min(NF, Math.floor(activeF * 1.1) + 1); fast = 0;
  }

  // в галактику плавно, обратно в сердце быстро, цвет возвращается почти мгновенно
  const dM = mode - M;
  M += Math.sign(dM) * Math.min(Math.abs(dM), dt / (held ? 1300 : 750));
  const dC = mode - C;
  C += Math.sign(dC) * Math.min(Math.abs(dC), dt / (held ? 260 : 200));
  boost = Math.max(0, boost - dt / 900);
  flash = Math.max(0, flash - dt / 800);
  stag = held ? 0.35 : 0.12;

  if(needPop && !held && M <= 0.001){
    needPop = false; pop = 1;
    spawnSparks(cx, cyH, 50, 3.5, true);            // сердце собралось: россыпь тёплых искр
  }
  pop = Math.max(0, pop - dt / 550);

  step = Math.min(dt / 16.67, 2.5);
  damp = Math.pow(held ? 0.83 : 0.855, step);
  breath = 1 + 0.035 * Math.sin(time * 1.3);
  beat = 1 + Math.pow(Math.max(0, Math.sin(time * 3.2)), 10) * 0.07 * (1 - M)
           + Math.sin(time * 1.6) * 0.015 + 0.09 * pop * pop;

  // центр галактики плывёт за пальцем, цвет зависит от его положения
  const tgx = held ? Math.max(W * 0.08, Math.min(W * 0.92, pointer.x)) : cx;
  const tgy = held ? Math.max(70, Math.min(H - 70, pointer.y)) : cyG;
  const follow = Math.min(1, 0.1 * step);
  gcx += (tgx - gcx) * follow; gcy += (tgy - gcy) * follow;
  hueBase = (gcx / W) * 300 + (gcy / H) * 70 + time * 25;

  // искры за пальцем
  if(held){
    const sp = Math.hypot(pointer.x - lastPX, pointer.y - lastPY);
    lastPX = pointer.x; lastPY = pointer.y;
    const n = Math.min(5, (sp / 6) | 0) + (Math.random() < 0.3 ? 1 : 0);
    if(n) spawnSparks(pointer.x, pointer.y, n, 2.5, false);
  }

  // шлейф: в галактике длинный, в сердце чёткий
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = `rgba(0,0,0,${(0.34 - 0.2 * M).toFixed(3)})`;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';

  head.fill(-1);
  for(let i = 0; i < activeN; i++){
    const p = parts[i];
    stepP(p);
    let gxi = (p.x / CELL | 0) + 1, gyi = (p.y / CELL | 0) + 1;
    if(gxi < 0) gxi = 0; else if(gxi >= cols) gxi = cols - 1;
    if(gyi < 0) gyi = 0; else if(gyi >= rows) gyi = rows - 1;
    const key = gxi + gyi * cols;
    next[i] = head[key]; head[key] = i;
  }
  for(let i = 0; i < activeF; i++) stepP(fill[i]);

  const hiNow = ((hueBase / HSTEP) | 0) % HUES;
  const pulse = 0.5 + 0.5 * Math.sin(time * 3.2);

  // мягкое сияние внутри сердца
  if(M < 0.98){
    const sz = scale * 44;
    ctx.globalAlpha = (0.09 + 0.07 * pulse + 0.1 * pop) * (1 - M);
    ctx.drawImage(spriteRed, cx - sz / 2, cyH - sz / 2, sz, sz);
    const sz2 = scale * 28;
    ctx.globalAlpha = (0.1 + 0.07 * pulse + 0.08 * pop) * (1 - M);
    ctx.drawImage(spritePink, cx - sz2 / 2, cyH - sz2 / 2, sz2, sz2);
  }
  // туманность галактики: три цветных облака вращаются вокруг ядра
  if(M > 0.02){
    for(let k = 0; k < 3; k++){
      const ang = time * 0.3 + k * TAU / 3;
      const ox = Math.cos(ang) * Rx * 0.3, oy = Math.sin(ang) * Rx * 0.15;
      const sz = Rx * 0.95;
      ctx.globalAlpha = 0.17 * M;
      ctx.drawImage(hueSprites[(hiNow + k * 12) % HUES], gcx + ox - sz / 2, gcy + oy - sz * 0.3, sz, sz * 0.6);
    }
    const szc = Rx * 0.5;
    ctx.globalAlpha = 0.3 * M;
    ctx.drawImage(hueSprites[hiNow], gcx - szc / 2, gcy - szc * 0.3, szc, szc * 0.6);
    const sz2 = Rx * 0.3;
    ctx.globalAlpha = 0.6 * M;
    ctx.drawImage(spriteWhite, gcx - sz2 / 2, gcy - sz2 * 0.3, sz2, sz2 * 0.6);
  }

  // звёздная пыль на фоне, чуть смещается за пальцем
  ctx.fillStyle = '#fff2f6';
  for(const s of stars){
    const tw = 0.5 + 0.5 * Math.sin(time * 2 + s.ph);
    ctx.globalAlpha = (0.12 + 0.3 * M) * tw * s.z * 0.8;
    ctx.fillRect(s.x + (gcx - cx) * 0.05 * s.z, s.y + (gcy - cyG) * 0.05 * s.z, 1.3, 1.3);
  }

  // линии: 6 цветовых групп + 12 радужных × 3 плотности
  const LINK = 30 + 12 * M, LINK2 = LINK * LINK;
  const baseOn = C < 0.98, hueOn = C > 0.02;
  const paths = [];
  for(let k = 0; k < 6 + BUCKETS * 3; k++) paths.push(new Path2D());
  for(let i = 0; i < activeN; i++){
    const p = parts[i];
    let gx = (p.x / CELL | 0) + 1, gy = (p.y / CELL | 0) + 1;
    if(gx < 0) gx = 0; else if(gx >= cols) gx = cols - 1;
    if(gy < 0) gy = 0; else if(gy >= rows) gy = rows - 1;
    for(let oy = -1; oy <= 1; oy++){
      const yy = gy + oy; if(yy < 0 || yy >= rows) continue;
      for(let ox = -1; ox <= 1; ox++){
        const xx = gx + ox; if(xx < 0 || xx >= cols) continue;
        for(let j = head[xx + yy * cols]; j !== -1; j = next[j]){
          if(j <= i) continue;
          const q = parts[j];
          const dx = p.x - q.x, dy = p.y - q.y, d = dx * dx + dy * dy;
          if(d < LINK2){
            const c = 1 - d / LINK2;
            const lvl = c > 0.6 ? 2 : c > 0.3 ? 1 : 0;
            if(baseOn){
              const pa = paths[(p.white && q.white ? 3 : 0) + lvl];
              pa.moveTo(p.x, p.y); pa.lineTo(q.x, q.y);
            }
            if(hueOn){
              const pb = paths[6 + (((p.hue / BSTEP) | 0) % BUCKETS) * 3 + lvl];
              pb.moveTo(p.x, p.y); pb.lineTo(q.x, q.y);
            }
          }
        }
      }
    }
  }
  ctx.lineWidth = 0.8;
  for(let lvl = 0; lvl < 3; lvl++){
    if(baseOn){
      ctx.globalAlpha = 1 - C;
      ctx.strokeStyle = redStyle[lvl];   ctx.stroke(paths[lvl]);
      ctx.strokeStyle = whiteStyle[lvl]; ctx.stroke(paths[3 + lvl]);
    }
    if(hueOn){
      ctx.globalAlpha = C;
      for(let b = 0; b < BUCKETS; b++){
        ctx.strokeStyle = hueStyle[b][lvl]; ctx.stroke(paths[6 + b * 3 + lvl]);
      }
    }
  }

  // звёзды внутри: каждая мерцает со своей частотой, яркие с лучиками
  const fl = 1 + flash * 0.6;
  for(let i = 0; i < activeF; i++){
    const p = fill[i];
    let tw = 0.5 + 0.5 * Math.sin(time * p.tw + p.ph);
    tw = tw * tw;
    const al = Math.min(1, (0.12 + 0.88 * tw) * 0.9 + flash * 0.3);
    const size = (p.big ? 11 + 7 * tw : 3 + p.r * 5 * (0.7 + 0.5 * tw)) * p.z * fl * (1 - 0.15 * M);
    drawP(p, size, al);
  }

  // контурные точки
  const sizeMul = (1 - 0.22 * M) * (1 + flash * 0.7);
  for(let i = 0; i < activeN; i++){
    const p = parts[i];
    const tw = 0.6 + 0.4 * Math.sin(time * 4 + p.ph) + flash * 0.4;
    drawP(p, p.r * 6.5 * sizeMul, tw > 1 ? 1 : tw);
  }

  // искры
  for(let i = sparks.length - 1; i >= 0; i--){
    const s = sparks[i];
    s.x += s.vx * step; s.y += s.vy * step; s.vx *= 0.955; s.vy = s.vy * 0.955 + 0.02 * step;
    s.life -= s.d * step;
    if(s.life <= 0){ sparks.splice(i, 1); continue; }
    const sz = (3 + 9 * s.life) * (s.big ? 1.6 : 1);
    ctx.globalAlpha = s.life;
    const spr = s.warm
      ? (s.big ? sparkleBase[s.b] : baseSprites[s.b])
      : (s.big ? sparkleHue : hueSprites)[(((s.hue % 360) / HSTEP) | 0) % HUES];
    ctx.drawImage(spr, s.x - sz / 2, s.y - sz / 2, sz, sz);
  }

  // вспышка в точке касания (мягкая, без колец)
  if(flash > 0.01){
    const sz = Math.min(W, H) * 0.95;
    ctx.globalAlpha = flash * 0.4;
    ctx.drawImage(hueSprites[hiNow], flashX - sz / 2, flashY - sz / 2, sz, sz);
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
